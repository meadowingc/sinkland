[package]
name = "sinkland"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
poem = { version = "3.1.12", features = ["server", "compression", "static-files", "embed"] }
tokio = { version = "1.17.0", features = ["rt-multi-thread", "macros", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3.9", features = ["env-filter"] }
tera = "1.20.1"
once_cell = "1.21.3"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
image = "0.25"
dotenvy = "0.15"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series", "area_series", "histogram", "boxplot", "errorbar"] }
url = "2.5"
lol_html = "2"
html-escape = "0.2"

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
rss = "2.0"
serde_json = "1.0"
parquet = "53.3.0"

[dev-dependencies]
tempfile = "3"
